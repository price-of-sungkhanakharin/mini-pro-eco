[project]
name = "ai-eco"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "alembic>=1.14.1",
    "arq>=0.26.3",
    "asyncpg>=0.30.0",
    "fastapi>=0.124.4",
    "label-studio-sdk>=1.0.8",
    "line-bot-sdk>=3.0.0",
    "minio>=7.2.7",
    "openpyxl>=3.1.5",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=10.4.0",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.8.1",
    "pyjwt>=2.9.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.33.0",
]

[project.optional-dependencies]
trainer = [
    "torch>=2.0.0",
]
